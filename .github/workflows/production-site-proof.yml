name: Production disclosure proof

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-site-proof.yml
      - examples/live-site.yml

permissions:
  contents: read

concurrency:
  group: production-disclosure-proof
  cancel-in-progress: true

jobs:
  released-action-production:
    name: Released Action checks the delivered site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run the released v0.3.0 Action
        id: proof
        uses: Rubiss/art50-ci@v0.3.0
        with:
          config: examples/live-site.yml
          output: artifacts/production-site
          artifact-name: production-site-v0.3.0
          retention-days: "1"

      - name: Verify the retained production evidence
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ steps.proof.outputs.report-directory }}
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const directory = process.env.REPORT_DIRECTORY;
          if (!directory) throw new Error("Missing report directory output.");
          const reportName = readdirSync(directory).find((name) => name.endsWith(".json"));
          if (!reportName) throw new Error("The production check produced no JSON report.");
          const report = JSON.parse(readFileSync(path.join(directory, reportName), "utf8"));
          const surface = report.surfaces?.[0];
          const check = surface?.checks?.[0];
          if (
            report.schemaVersion !== 2 ||
            report.tool?.version !== "0.3.0" ||
            report.passed !== true ||
            report.summary?.totalSurfaces !== 1 ||
            report.summary?.passedSurfaces !== 1 ||
            report.summary?.totalChecks !== 1 ||
            report.summary?.passedChecks !== 1 ||
            surface?.surfaceId !== "production-boundary" ||
            surface?.passed !== true ||
            surface?.finalUrl !== "https://art50-ci.rubiss89.chatgpt.site/" ||
            !/^[0-9a-f]{64}$/u.test(surface?.pageContentSha256 ?? "") ||
            surface?.screenshotPath !== null ||
            surface?.screenshotSha256 !== null ||
            check?.disclosureId !== "product-boundary" ||
            check?.passed !== true ||
            check?.actualVisible !== true ||
            check?.inViewport !== true ||
            check?.unobstructed !== true ||
            check?.accessible !== true ||
            !existsSync(path.join(directory, reportName))
          ) {
            throw new Error("The released Action did not retain the expected production evidence.");
          }
          if (
            !process.env.ARTIFACT_ID ||
            !/^[0-9a-f]{64}$/u.test(process.env.ARTIFACT_DIGEST ?? "")
          ) {
            throw new Error("The Action did not expose a retained artifact ID and digest.");
          }
          NODE
