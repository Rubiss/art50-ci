name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: cd examples/c2pa-delivery && sha256sum -c SHA256SUMS.txt
      - run: npm pack --dry-run

  action-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: action-source

      - name: Prepare a non-Node consumer workspace
        shell: bash
        run: |
          cp -R action-source/tests/fixtures/action-consumer consumer
          mkdir -p consumer/assets
          cp action-source/examples/c2pa-delivery/assets/c2pa-source.png consumer/assets/
          cp action-source/examples/c2pa-delivery/assets/c2pa-delivered.png consumer/assets/
          cp action-source/examples/c2pa-delivery/assets/c2pa-delivered-stripped.png consumer/assets/
          test ! -e package.json
          test ! -e package-lock.json

      - name: Run the isolated composite action
        id: passing
        uses: ./action-source
        with:
          config: consumer/pass.yml
          output: artifacts/action-pass
          artifact-name: art50-ci-action-pass
          retention-days: "1"

      - name: Verify schema-v2 passing evidence
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ steps.passing.outputs.report-directory }}
          ARTIFACT_ID: ${{ steps.passing.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.passing.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const directory = process.env.REPORT_DIRECTORY;
          if (!directory) throw new Error("Missing report directory output.");
          const reportName = readdirSync(directory).find((name) => name.endsWith(".json"));
          if (!reportName) throw new Error("The action produced no aggregate JSON report.");
          const report = JSON.parse(readFileSync(path.join(directory, reportName), "utf8"));
          if (report.schemaVersion !== 2 || report.passed !== true) {
            throw new Error("The action report was not a passing schema-v2 document.");
          }
          const provenance = report.provenance?.[0];
          const source = provenance?.source;
          const delivered = provenance?.delivered;
          const sha256 = (file) =>
            createHash("sha256").update(readFileSync(file)).digest("hex");
          if (
            report.summary.totalProvenance !== 1 ||
            report.summary.passedProvenance !== 1 ||
            provenance?.passed !== true ||
            provenance?.failures?.length !== 0 ||
            provenance?.activeLabelPreserved !== true ||
            source?.c2pa?.manifestPresent !== true ||
            source?.c2pa?.embedded !== true ||
            source?.c2pa?.validationState !== "Valid" ||
            !source?.c2pa?.validationStatuses?.length ||
            source?.c2pa?.validationStatuses?.some((status) => status.success === false) ||
            !source?.c2pa?.digitalSourceTypes?.includes(
              "http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia",
            ) ||
            delivered?.c2pa?.manifestPresent !== true ||
            delivered?.c2pa?.embedded !== true ||
            delivered?.c2pa?.validationState !== "Valid" ||
            !delivered?.c2pa?.validationStatuses?.length ||
            delivered?.c2pa?.validationStatuses?.some((status) => status.success === false) ||
            !delivered?.c2pa?.manifestAncestryLabels?.includes(source?.c2pa?.activeLabel) ||
            !delivered?.c2pa?.manifestLabels?.includes(source?.c2pa?.activeLabel) ||
            delivered?.c2pa?.digitalSourceTypes?.length !== 0 ||
            source?.sha256 !== sha256("consumer/assets/c2pa-source.png") ||
            delivered?.sha256 !== sha256("consumer/assets/c2pa-delivered.png") ||
            !existsSync(path.join(directory, source?.evidencePath ?? "")) ||
            !existsSync(path.join(directory, delivered?.evidencePath ?? ""))
          ) {
            throw new Error("The action did not preserve passing C2PA delivery evidence.");
          }
          if (!process.env.ARTIFACT_ID || !/^[0-9a-f]{64}$/u.test(process.env.ARTIFACT_DIGEST ?? "")) {
            throw new Error("The action did not expose a retained artifact ID and digest.");
          }
          NODE

      - name: Run an intentionally failing stripped-delivery assertion
        id: failing
        continue-on-error: true
        uses: ./action-source
        with:
          config: consumer/c2pa-fail.yml
          output: artifacts/action-fail
          artifact-name: art50-ci-action-fail
          retention-days: "1"
          install-browser: "false"

      - name: Verify evidence was retained before exit 1
        if: ${{ always() }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          REPORT_DIRECTORY: ${{ steps.failing.outputs.report-directory }}
          ARTIFACT_ID: ${{ steps.failing.outputs.artifact-id }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
          test -n "$ARTIFACT_ID"
          test -n "$REPORT_DIRECTORY"
          test -d "$REPORT_DIRECTORY"
          test ! -e package.json
          test ! -e package-lock.json
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const directory = process.env.REPORT_DIRECTORY;
          const reportName = readdirSync(directory).find((name) => name.endsWith(".json"));
          if (!reportName) throw new Error("The failing action produced no aggregate JSON report.");
          const report = JSON.parse(readFileSync(path.join(directory, reportName), "utf8"));
          const provenance = report.provenance?.[0];
          const failures = provenance?.failures ?? [];
          const source = provenance?.source;
          const delivered = provenance?.delivered;
          if (
            report.schemaVersion !== 2 ||
            report.passed !== false ||
            report.summary.failedProvenance !== 1 ||
            report.summary.totalFailures !== 2 ||
            provenance?.passed !== false ||
            provenance?.activeLabelPreserved !== null ||
            failures.length !== 2 ||
            failures[0]?.code !== "MANIFEST_MISSING" ||
            failures[0]?.target !== "delivered" ||
            failures[1]?.code !== "SOURCE_MANIFEST_NOT_IN_DELIVERED_CHAIN" ||
            failures[1]?.target !== "comparison" ||
            source?.c2pa?.validationState !== "Valid" ||
            delivered?.c2pa?.manifestPresent !== false ||
            !existsSync(path.join(directory, source?.evidencePath ?? "")) ||
            !existsSync(path.join(directory, delivered?.evidencePath ?? ""))
          ) {
            throw new Error("The expected stripped-delivery failures were not retained.");
          }
          NODE
