name: C2PA delivery proof

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/workflows/c2pa-delivery-proof.yml
      - examples/c2pa-delivery/**

permissions:
  contents: read

concurrency:
  group: c2pa-delivery-proof
  cancel-in-progress: true

jobs:
  released-action-pass:
    name: Released Action preserves source ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the released v0.3.0 Action
        id: proof
        uses: Rubiss/art50-ci@v0.3.0
        with:
          config: examples/c2pa-delivery/pass.yml
          output: artifacts/c2pa-delivery-pass
          artifact-name: c2pa-delivery-pass-v0.3.0
          retention-days: "90"
          install-browser: "false"

      - name: Verify the retained passing evidence
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ steps.proof.outputs.report-directory }}
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const directory = process.env.REPORT_DIRECTORY;
          const reportName = readdirSync(directory).find((name) => name.endsWith(".json"));
          if (!reportName) throw new Error("The released Action produced no aggregate JSON report.");
          const report = JSON.parse(readFileSync(path.join(directory, reportName), "utf8"));
          const provenance = report.provenance?.[0];
          const source = provenance?.source;
          const delivered = provenance?.delivered;
          if (
            report.schemaVersion !== 2 ||
            report.tool?.version !== "0.3.0" ||
            report.passed !== true ||
            report.summary?.passedProvenance !== 1 ||
            provenance?.passed !== true ||
            provenance?.activeLabelPreserved !== true ||
            source?.c2pa?.manifestPresent !== true ||
            source?.c2pa?.embedded !== true ||
            source?.c2pa?.validationState !== "Valid" ||
            source?.c2pa?.validationStatuses?.some((status) => status.success === false) ||
            delivered?.c2pa?.manifestPresent !== true ||
            delivered?.c2pa?.embedded !== true ||
            delivered?.c2pa?.validationState !== "Valid" ||
            delivered?.c2pa?.validationStatuses?.some((status) => status.success === false) ||
            !delivered?.c2pa?.manifestAncestryLabels?.includes(source?.c2pa?.activeLabel) ||
            !existsSync(path.join(directory, source?.evidencePath ?? "")) ||
            !existsSync(path.join(directory, delivered?.evidencePath ?? "")) ||
            !process.env.ARTIFACT_ID
          ) {
            throw new Error("The released Action did not retain the declared passing proof.");
          }
          NODE

  released-action-negative:
    name: Released Action detects a stripped delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the expected-failure control through v0.3.0
        id: proof
        continue-on-error: true
        uses: Rubiss/art50-ci@v0.3.0
        with:
          config: examples/c2pa-delivery/stripped-fail.yml
          output: artifacts/c2pa-delivery-stripped
          artifact-name: c2pa-delivery-stripped-v0.3.0
          retention-days: "90"
          install-browser: "false"

      - name: Verify the retained expected-failure evidence
        if: ${{ always() }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.proof.outcome }}
          EXIT_CODE: ${{ steps.proof.outputs.exit-code }}
          REPORT_DIRECTORY: ${{ steps.proof.outputs.report-directory }}
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
          test -n "$ARTIFACT_ID"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const directory = process.env.REPORT_DIRECTORY;
          const reportName = readdirSync(directory).find((name) => name.endsWith(".json"));
          if (!reportName) throw new Error("The released Action produced no failure report.");
          const report = JSON.parse(readFileSync(path.join(directory, reportName), "utf8"));
          const provenance = report.provenance?.[0];
          const failures = provenance?.failures ?? [];
          if (
            report.schemaVersion !== 2 ||
            report.tool?.version !== "0.3.0" ||
            report.passed !== false ||
            report.summary?.totalFailures !== 2 ||
            provenance?.activeLabelPreserved !== null ||
            failures.length !== 2 ||
            failures[0]?.code !== "MANIFEST_MISSING" ||
            failures[0]?.target !== "delivered" ||
            failures[1]?.code !== "SOURCE_MANIFEST_NOT_IN_DELIVERED_CHAIN" ||
            failures[1]?.target !== "comparison" ||
            provenance?.source?.c2pa?.validationState !== "Valid" ||
            provenance?.delivered?.c2pa?.manifestPresent !== false ||
            !existsSync(path.join(directory, provenance?.source?.evidencePath ?? "")) ||
            !existsSync(path.join(directory, provenance?.delivered?.evidencePath ?? ""))
          ) {
            throw new Error("The expected stripped-delivery evidence was not retained.");
          }
          NODE
