name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `v${version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag ${process.env.RELEASE_TAG} does not match package version ${version}; expected ${expectedTag}.`,
            );
          }
          NODE

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: cd examples/c2pa-delivery && sha256sum -c SHA256SUMS.txt

      - name: Package the release
        id: package
        shell: bash
        run: |
          npm pack --json > npm-pack.json
          package_file="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packs = JSON.parse(readFileSync("npm-pack.json", "utf8"));
          if (packs.length !== 1 || !packs[0]?.filename) {
            throw new Error("npm pack did not produce exactly one package.");
          }
          console.log(packs[0].filename);
          NODE
          )"
          test -f "$package_file"
          echo "filename=$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.filename }}
        run: npm publish "$PACKAGE_TARBALL" --access public
