name: Bug report
description: Report a reproducible false result or execution problem.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, personal data, and sensitive screenshots before posting.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact failure code and a minimal reproduction when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: art50-ci version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: Node 22.18.0 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal redacted configuration
      render: yaml
  - type: checkboxes
    id: boundary
    attributes:
      label: Scope confirmation
      options:
        - label: I understand this project reports technical observations and does not provide a legal compliance conclusion.
          required: true
