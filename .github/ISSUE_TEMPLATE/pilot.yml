name: Monitored launch fit check
description: Check whether the founding €500 monitored release-gate launch fits—no payment or private details at this step.
title: "[fit] "
labels:
  - pilot
body:
  - type: markdown
    attributes:
      value: |
        ## Monitored launch fit check

        The art50-ci software remains free. This public, under-one-minute check is only for the optional €500 one-time, 30-day monitored release-gate launch described in [IMPLEMENTATION.md](https://github.com/Rubiss/art50-ci/blob/main/IMPLEMENTATION.md).

        Select the first control you want tested. Do not post product URLs, customer media, credentials, personal data, repository details, or confidential legal analysis.

        A maintainer will reply with preliminary fit or no-fit before requesting private details. Preliminary fit means the selected check can fall within the offer; final acceptance follows a private technical intake. Unsupported targets receive a no-fit response.

        If you want to continue after preliminary fit, reply **open private intake** in the public issue. No private GitHub scope repository is created and no invitation is sent until you opt in. That private repository is for sanitized scope records only—not credentials, payment data, customer media, product source code, or retained run evidence. No customer product, repository, or system access or payment is requested before the private scope is accepted.
  - type: dropdown
    id: surface
    attributes:
      label: Which first release check should we evaluate?
      options:
        - Browser-based AI interaction disclosure
        - On-page visible label beside AI-generated or manipulated content
        - Source manifest label in the delivered C2PA chain
        - A combination or not sure yet
    validations:
      required: true
  - type: checkboxes
    id: authority
    attributes:
      label: Authority and boundary
      options:
        - label: I am authorized to discuss technical testing for this product.
          required: true
        - label: I understand this is technical implementation, not legal advice or certification.
          required: true
