name: Implementation fit check
description: Check whether one art50-ci release gate fits your pipeline—no payment or private details at this step.
title: "[fit] "
labels:
  - pilot
body:
  - type: markdown
    attributes:
      value: |
        This public first step should take under a minute.

        Select the first control you want tested. Do not post product URLs, customer media, credentials, personal data, repository details, or confidential legal analysis.

        A maintainer will reply with fit or no-fit before requesting details. If it fits, the technical intake moves to a private channel. No payment or repository access is requested at this step.
  - type: dropdown
    id: surface
    attributes:
      label: Which first release check should we evaluate?
      options:
        - Browser-based AI interaction disclosure
        - Visible AI-generated or manipulated content label
        - Source manifest label in the delivered C2PA chain
        - A combination or not sure yet
    validations:
      required: true
  - type: checkboxes
    id: authority
    attributes:
      label: Authority and boundary
      options:
        - label: I am authorized to discuss technical testing for this product.
          required: true
        - label: I understand this is technical implementation, not legal advice or certification.
          required: true
