# yaml-language-server: $schema=../../schema/art50-ci.schema.json
version: 1

project:
  name: Browser obstruction broken fixture

browser:
  viewport:
    width: 640
    height: 480

output:
  directory: ../../.art50-ci/browser-obstruction-broken
  screenshots: true

surfaces:
  - id: disclosure-obstruction-demo
    name: AI generation notice behind a cookie overlay
    target: ./broken.html
    disclosures:
      - id: ai-generation-notice
        selector: "[data-ai-disclosure]"
        expectedText: "generated by AI"
        accessibleName: "AI generation notice"
