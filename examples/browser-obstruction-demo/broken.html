<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Broken AI disclosure fixture</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: #f4f1e9;
        color: #17201c;
        font-family: system-ui, sans-serif;
      }
      main { padding: 48px; }
      .kicker {
        color: #0f6b49;
        font: 700 12px/1.2 ui-monospace, monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 { max-width: 11ch; margin: 12px 0 30px; font-size: 48px; line-height: 1; }
      label { display: grid; max-width: 430px; gap: 8px; font-size: 13px; font-weight: 700; }
      input { min-height: 48px; padding: 12px; border: 1px solid #aeb8b1; border-radius: 5px; }
      button {
        margin-top: 12px;
        padding: 11px 18px;
        border: 0;
        border-radius: 4px;
        background: #17201c;
        color: #75efb0;
        font-weight: 750;
      }
      [data-ai-disclosure] {
        position: fixed;
        right: 32px;
        bottom: 78px;
        left: 32px;
        margin: 0;
        padding: 13px 15px;
        border: 1px solid #9fc9b3;
        border-radius: 5px;
        background: #e5f7ed;
        color: #164c35;
        font-size: 13px;
        font-weight: 700;
      }
      .cookie-overlay {
        position: fixed;
        right: 18px;
        bottom: 10px;
        left: 18px;
        z-index: 2;
        min-height: 120px;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 2px solid #f2674f;
        border-radius: 5px;
        background: #fff8f4;
        box-shadow: 0 8px 24px rgb(55 25 19 / 18%);
      }
      .cookie-overlay span { color: #58645e; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Example assistant</p>
      <h1>What would you like to create?</h1>
      <label>
        Prompt
        <input disabled placeholder="Describe an image…">
      </label>
      <button disabled type="button">Generate</button>
      <p data-ai-disclosure aria-label="AI generation notice">
        Images from this tool are generated by AI.
      </p>
      <div class="cookie-overlay">
        <strong>We use cookies</strong>
        <span>Preferences · Reject · Accept</span>
      </div>
    </main>
  </body>
</html>
