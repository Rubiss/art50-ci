<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser assertion failure matrix</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 32px;
      }

      .notice {
        background: #eef5ff;
        border: 1px solid #aac8ef;
        padding: 8px;
      }

      #hidden-control {
        display: none;
      }

      #overlay-zone {
        height: 72px;
        position: relative;
        width: 360px;
      }

      #obstructed-control,
      #overlay-blocker {
        box-sizing: border-box;
        inset: 0;
        margin: 0;
        padding: 12px;
        position: absolute;
      }

      #overlay-blocker {
        background: white;
        border: 1px solid #222;
        z-index: 2;
      }

      #below-initial-viewport {
        left: 32px;
        position: absolute;
        top: 900px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="notice" id="passing-control">
        You are interacting with an AI system.
      </p>
      <p id="text-mismatch-control">This is unrelated product copy.</p>
      <p id="hidden-control">This disclosure should be visible.</p>
      <p id="visible-control">This disclosure should be hidden.</p>
      <p
        aria-label="Generic disclosure"
        id="accessible-name-control"
      >
        This response was generated by AI.
      </p>
      <button disabled id="disabled-first-interaction" type="button">
        Start conversation
      </button>
      <div id="overlay-zone">
        <p class="notice" id="obstructed-control">
          This response was generated by AI.
        </p>
        <div id="overlay-blocker">Blocking overlay</div>
      </div>
      <p class="notice" id="below-initial-viewport">
        This response was generated by AI.
      </p>
    </main>
  </body>
</html>
