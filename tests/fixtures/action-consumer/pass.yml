version: 1

project:
  name: composite-action-fixture

output:
  directory: artifacts/unused
  screenshots: false

surfaces:
  - id: local-disclosure
    name: Deterministic local disclosure
    kind: website
    target: ./surface.html
    disclosures:
      - id: ai-notice
        selector: "[data-ai-disclosure]"
        expectedText: "You are interacting with an AI system"
        match: contains
        visible: true
        inViewport: true
        unobstructed: true
        accessible: true

provenance:
  - id: local-c2pa-delivery
    name: Committed C2PA source-to-delivery fixture
    source: ./assets/c2pa-source.png
    delivered: ./assets/c2pa-delivered.png
    requireManifest: true
    requireEmbedded: true
    requireSourceManifestInDeliveredChain: true
    failOnInvalid: true
